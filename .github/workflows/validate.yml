name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Reject Windows-illegal filenames
        run: bun scripts/check-windows-filenames.cjs

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run validation suite
        run: bun run validate:ci

      - name: Retail domain and isolated inference regression
        run: |
          bun run retail:check
          bun test apps/electron/src/main/__tests__/retail-inference-telemetry.test.ts scripts/i18n-coverage.test.ts scripts/merqo-signal-pagination.test.ts
          bun run retail:check:mcp
          bun test packages/shared/src/agent/__tests__/retail-tool-boundary.test.ts
